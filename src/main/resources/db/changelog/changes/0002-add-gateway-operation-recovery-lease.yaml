databaseChangeLog:
  - changeSet:
      id: payment-gateway-0002-operation-recovery-lease
      author: electrahub
      changes:
        - addColumn:
            schemaName: payment_gateway
            tableName: gateway_operation
            columns:
              - column:
                  name: recovery_lease_until
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: next_recovery_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: recovery_attempt_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_recovery_error_code
                  type: VARCHAR(96)
        - createIndex:
            schemaName: payment_gateway
            tableName: gateway_operation
            indexName: idx_gateway_operation_due_recovery
            columns:
              - column: { name: status }
              - column: { name: next_recovery_at }
              - column: { name: recovery_lease_until }
      rollback:
        - dropIndex:
            schemaName: payment_gateway
            tableName: gateway_operation
            indexName: idx_gateway_operation_due_recovery
        - dropColumn:
            schemaName: payment_gateway
            tableName: gateway_operation
            columnName: last_recovery_error_code
        - dropColumn:
            schemaName: payment_gateway
            tableName: gateway_operation
            columnName: recovery_attempt_count
        - dropColumn:
            schemaName: payment_gateway
            tableName: gateway_operation
            columnName: next_recovery_at
        - dropColumn:
            schemaName: payment_gateway
            tableName: gateway_operation
            columnName: recovery_lease_until
